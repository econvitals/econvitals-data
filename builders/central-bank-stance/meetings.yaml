    dates: []
  JP:
    name: Bank of Japan
    source_url: https://www.boj.or.jp/en/mopo/mpmsche_minu/index.htm
    note: decision day = second (last) day of the two-day MPM
    dates: [2026-10-30, 2026-12-18, 2027-01-22, 2027-03-18, 2027-04-28, 2027-06-11, 2027-07-22, 2027-09-22, 2027-10-29, 2027-12-17]
  IN:
    name: Reserve Bank of India
    source_url: https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=62422
