# Scheduled policy-decision dates, read from each bank's own site. Hand-maintained once a year;
# build.py --check-stale fails when any bank's last listed date is within 60 days of today.
fetched: 2026-10-25
banks:
  US:
    name: Federal Reserve
    source_url: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
    note: decision day = second day of the two-day meeting; 2027 dates are tentative until confirmed at the preceding meeting
    dates: [2026-10-28, 2026-12-09, 2027-01-27, 2027-03-17, 2027-04-28, 2027-06-09, 2027-07-28, 2027-09-15, 2027-10-27, 2027-12-08]
  XM:
    name: European Central Bank
    source_url: https://www.ecb.europa.eu/press/calendars/mgcgc/html/index.en.html
    note: monetary policy Governing Council meetings only (day 2, press-conference day); non-monetary and General Council meetings excluded
    dates: [2026-10-29, 2026-12-17, 2027-02-04, 2027-03-18, 2027-04-29, 2027-06-10, 2027-07-22, 2027-09-09, 2027-10-28, 2027-12-16]
  GB:
    name: Bank of England
    source_url: https://www.bankofengland.co.uk/monetary-policy/upcoming-mpc-dates
    note: MPC announcement dates; 2027 listed as confirmed
    dates: [2026-11-05, 2026-12-17, 2027-02-04, 2027-03-18, 2027-04-29, 2027-06-17, 2027-07-29, 2027-09-16, 2027-11-04, 2027-12-16]
  CA:
    name: Bank of Canada
    source_url: https://www.bankofcanada.ca/core-functions/monetary-policy/key-interest-rate/schedule/
    note: fixed announcement dates
    dates: [2026-10-28, 2026-12-09, 2027-01-27, 2027-03-03, 2027-04-28, 2027-06-02, 2027-07-21, 2027-09-08, 2027-10-27, 2027-12-08]
  AU:
    name: Reserve Bank of Australia
    source_url: https://www.rba.gov.au/schedules-events/board-meeting-schedules.html
    note: Monetary Policy Board meetings; decision day = second day of the two-day meeting
    dates: [2026-11-03, 2026-12-08, 2027-02-09, 2027-03-23, 2027-05-04, 2027-06-22, 2027-08-10, 2027-09-28, 2027-11-02, 2027-12-14]
  CH:
    name: Swiss National Bank
    source_url: https://www.snb.ch/en/services-events/digital-services/event-schedule
