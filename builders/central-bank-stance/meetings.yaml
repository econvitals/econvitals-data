    dates: [2026-11-04, 2026-12-16, 2027-02-03, 2027-03-24, 2027-05-05, 2027-06-22]
  "NO":
    name: Norges Bank
    source_url: https://www.norges-bank.no/en/news-events/calendar/policy-rate-decisions/
    note: policy rate decision announcement dates (10:00 CET)
    dates: [2026-11-05, 2026-12-17, 2027-01-21, 2027-03-18, 2027-05-05, 2027-06-17, 2027-08-19, 2027-09-23, 2027-11-04, 2027-12-16]
  NZ:
    name: Reserve Bank of New Zealand
    source_url: https://www.rbnz.govt.nz/monetary-policy/about-monetary-policy/monetary-policy-decision-dates
