    dates: [2026-12-10, 2027-03-18, 2027-06-24, 2027-09-23, 2027-12-16]
  SE:
    name: Sveriges Riksbank
    source_url: https://www.riksbank.se/en-gb/press-and-published/calendar/calendar-2027/
