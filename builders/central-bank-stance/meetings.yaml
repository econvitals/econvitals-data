    dates: [2026-12-04, 2027-02-05]
  CN:
    name: People's Bank of China
    rule: lpr_20th      # 1-year LPR fixing: the 20th, or the next business day
    source_url: http://www.pbc.gov.cn/en/3688229/3688335/3883798/index.html
    note: not fetched by design; the monthly Loan Prime Rate is published on the 20th or the next business day when the 20th is a weekend or holiday
    dates: []
