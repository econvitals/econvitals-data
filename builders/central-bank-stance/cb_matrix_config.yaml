# Global Central Bank Stance Matrix — manual overrides
# =====================================================
# This is the ONLY file you hand-edit after the build. `build.py` reads it on
# every run and merges it over the data pulled from BIS. Nothing here touches
# code or thresholds in build.py.
#
# What you can set per bank:
#   phase_override : force the cycle phase   (Hiking | On Hold | Cutting | Paused)
#   phase_override_edited : the ISO date the override was written — REQUIRED with
#                    phase_override. It EXPIRES exactly like a desk view (below): once the
#                    bank has decided after that date, after 60 days, or if undated, the
#                    build drops it so the rule speaks, prints a WARNING, and lists the bank
#                    in meta.review_pending for the daily ops mail.
#   next_move      : an EDITOR'S OVERRIDE of the next-move view (free text) — rarely needed since
#                    2026-10-25: what the desks expect is compiled automatically from the macro@
#                    mailbox into desk.json (macro-briefing cb_desk.py) and what markets price
#                    comes from markets.py, both shown beside the rule's phase. Leave unset unless
#                    you want to overrule the compiled view with a sentence of your own; the
#                    automatic fallback is a description of the phase ("In a hiking cycle (rule)").
#   next_move_edited : the ISO date the desk view was written — REQUIRED with next_move.
#                    A desk view EXPIRES: once the bank has made a policy decision after
#                    that date (its last move, from the rate history), or once the date
#                    is more than 60 days old (build.py DESK_VIEW_MAX_AGE_DAYS), or when
#                    it is undated, the page shows "Review pending" in its place (never
#                    the stale text), the build prints a WARNING, and the bank is listed in
#                    meta.review_pending, which the daily 6:10 ops mail reports (jobhost-ops
#                    ops_health.check_stance_review_pending). NOT an Action failure — the
#                    page is already honest about it. Rewrite next_move and re-date
#                    next_move_edited to clear it, or remove both for the auto lean.
#   manual_rate    : EMERGENCY FALLBACK — a rate entered BY HAND for a bank BIS has stopped
#                    relaying and whose own source is down too — `value`, `date` (the decision date), `verified`
#                    (the day the bank's own page was last read at that value), `source`
#                    and `source_url`. Spliced on like a fast feed, but only while it is
#                    newer than BIS: once BIS catches up the block is ignored (the build
#                    says so) and should be deleted. The page marks the row "entered by hand".
#                    A hand entry must not go stale silently: once `verified` is more than
#                    75 days old (build.py STALE_AFTER_DAYS) the workflow's last step,
#                    `build.py --check-stale`, FAILS the run after the publish, naming the
#                    bank and the date, so GitHub emails the owner. Re-read the bank's page
#                    and bump `verified` (and value/date if it moved) to clear it.
#                    The same step also fails when a bank that HAS a fast source (US, XM,
#                    GB, CA, IN in fast_sources.FAST) was served by BIS this run with a BIS
#                    observation more than 45 days old (build.py FEED_FALLBACK_AFTER_DAYS):
#                    its feed failed AND BIS is stale, the India case. The page still
#                    publishes the BIS value with its date; the failure email names the
#                    bank, the source that failed and the BIS date. Fix the feed, or add a
#                    manual_rate meanwhile.
#
# Two more files sit beside this one and are NOT overrides: `meetings.yaml` (each bank's scheduled
# decision dates, hand-copied once a year from the bank's own schedule page — a bank whose dates
# run out within 60 days is named in the 6:10 ops mail) and the press-feed table in `feeds.py`
# (each bank's official RSS feed and the title pattern of its decision release).
#
# `lookback_months` is the window used to auto-classify the cycle phase from the
# most recent rate change (a cut/hike inside the window = Cutting/Hiking; older
# than the window but within a year = On Hold; older than a year = Paused).

lookback_months: 6

# Display order + identity for each bank. `code` is the BIS REF_AREA.
banks:
  - code: "US"
    name: Federal Reserve
    country: United States
    flag: "\U0001F1FA\U0001F1F8"
    instrument: Federal Funds Rate (target range)
    # phase_override: On Hold
    # next_move: "v 25bp by Dec 2026"
    # next_move_edited: 2026-06-16

  - code: "XM"
    name: European Central Bank
    country: Euro area
    flag: "\U0001F1EA\U0001F1FA"
    instrument: Deposit Facility Rate

  - code: "JP"
    name: Bank of Japan
    country: Japan
    flag: "\U0001F1EF\U0001F1F5"
    instrument: Overnight Call Rate
    # BoJ is the classic "on hold but with a tightening bias" case — set a
    # phase_override / next_move here when the data-driven phase reads wrong.

  - code: "GB"
    name: Bank of England
    country: United Kingdom
    flag: "\U0001F1EC\U0001F1E7"
    instrument: Bank Rate

  - code: "CA"
    name: Bank of Canada
    country: Canada
    flag: "\U0001F1E8\U0001F1E6"
    instrument: Overnight Rate

  - code: "AU"
    name: Reserve Bank of Australia
    country: Australia
    flag: "\U0001F1E6\U0001F1FA"
    instrument: Cash Rate

  - code: "CH"
    name: Swiss National Bank
    country: Switzerland
    flag: "\U0001F1E8\U0001F1ED"
    instrument: SNB Policy Rate

  - code: "SE"
    name: Sveriges Riksbank
    country: Sweden
    flag: "\U0001F1F8\U0001F1EA"
    instrument: Policy Rate

  - code: "NO"
    name: Norges Bank
    country: Norway
    flag: "\U0001F1F3\U0001F1F4"
    instrument: Policy Rate

  - code: "NZ"
    name: Reserve Bank of New Zealand
    country: New Zealand
    flag: "\U0001F1F3\U0001F1FF"
    instrument: Official Cash Rate

  - code: "CN"
    name: People's Bank of China
    country: China
    flag: "\U0001F1E8\U0001F1F3"
    instrument: 1-Year Loan Prime Rate (LPR)

  - code: "IN"
    name: Reserve Bank of India
    country: India
    flag: "\U0001F1EE\U0001F1F3"
    instrument: Policy Repo Rate
    # BIS stopped relaying the RBI's rate after 2026-07-23 (it missed the October 2026 hike), so
    # since 2026-10-21 this row is topped up from the RBI's own site (fast_sources.rbi_in: the
    # home page's "Policy Repo Rate" box + the MPC resolution press releases) — Jason reversed
    # his 2026-10-09 no-scrape ruling that day. If that source breaks while BIS is still stopped,
    # the emergency fallback is a manual_rate block (form in the header above).
