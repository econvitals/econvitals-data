# ============================================================================
# Housing Bubble Monitor — editorial config (the ONLY file hand-edited post-build)
# ----------------------------------------------------------------------------
# fetch_housing.py reads this, pulls live values for every indicator that has a
# `source:` block (from FRED — each key IS a FRED series id), and writes data.json
# in the shape housing.js renders. Everything NOT computed lives here:
#
#   pos   0(cool)–100(hot) — current temperature on the gauge. EDITORIAL, not
#         computed. Jason's calibration vs. the indicator's own history.
#   band  [lo,hi] on the same 0–100 scale — the shaded historical range.
#   ref   reference tick {pos,label} — e.g. the long-run average or the '06 peak.
#   tone  cool | warm | hot — the marker colour (editorial temperature).
#   badge short status chip.   note  one-line read.   slot:true  ◇ awaiting a feed.
#
# The fetcher fills val / spark / table v,p,d / asof from data. If a fetch fails
# it keeps the `val` written here (so the page never blanks). Calibration is
# editorial judgment, NOT a published index — override freely.
#
# To wire a parked row to live data: give it a `source:` block whose `series` is a
# FRED id (see the wired rows for the pattern). To re-calibrate: edit pos / band /
# ref / tone / note.
# ============================================================================

masthead:
  eyebrow: "Macro Tracker · Diagnostic Panel"
  title: "Housing Bubble Monitor"
  sub: >-
    A market-temperature read across four diagnostic systems — valuation,
    affordability, supply & activity, and financing stress — pulling the
    strongest single signal from each into one verdict.

# ── The verdict strip. EDITORIAL — never computed. ──────────────────────────
verdict:
  headline: "Stretched, not bubbly. A slow grind toward balance — not 2006-style crash risk."
  # Editorial revision date of the verdict itself — separate from the (daily) data
  # refresh, so a hand-set judgment isn't stamped "updated today" (LW5).
  revised: "2026-06-16"
  lights:
    - {label: "Valuation", state: "Stretched", tone: "caution",
       gloss: "Levels elevated vs. fundamentals; correcting in real terms."}
    - {label: "Affordability", state: "Tight", tone: "caution",
       gloss: "Payments near record in dollars; easing at the margin as income outpaces prices."}
    - {label: "Activity", state: "Cooling", tone: "caution",
       gloss: "Buyer's market, record price cuts — but thawing at the margin."}
    - {label: "Stability", state: "Sound", tone: "sound",
       gloss: "High equity, low LTV. Stress confined to FHA/VA tails."}

# ── PROVENANCE (history — nothing below reads this). Nine of the FRED ids used in
# this file were once value-verified against their twin on the retired Macrobond
# feed, before that subscription ended 2026-07-25: MORTGAGE30US, EXHOSLUSM495S,
# HOSSUPUSM673N, MSPUS, HSN1F, HOSMEDUSM052N, HOEREPHRE, CPIAUCSL and HOUST (that
# last one matched to rel 0.000). The rest were never twinned — CSUSHPISA is a
# licensed S&P product that vendor tier didn't carry, and CUSR0000SEHA,
# MEHOINUSA646N, FIXHAI, DRSFRMACBS, SUBLPDHMSENQ, ACTLISCOUUS, PRIREDCOUUS,
# MEDDAYONMARUS are FRED-native here.
#
# HOSMEDUSM052N's FRED history only goes back to 2025-06 (a genuinely new series),
# so the "vs. 2019" gauge below can't be recomputed from it and keeps its frozen
# editorial value — not fixable without a paid source.

sections:
  # ── 01 · Price & valuation ────────────────────────────────────────────────
  - id: valuation
    num: "01"
    title: "Price & valuation"
    tag: "momentum cool · levels stretched"
    kind: gauges
    items:
      - id: cs_yoy
        name: "Case-Shiller national, YoY"
        unit: "% nom"
        val: "+0.7"
        pos: 24
        tone: cool
        band: [6, 96]
        ref: {pos: 52, label: "avg ≈5%"}
        badge: "Cooling"
        note: "14th straight month of deceleration; weakest since Jun 2023."
        source: {transform: yoy, series: CSUSHPISA, fmt: {decimals: 1, sign: true}}
      - id: real_yoy
        name: "Real home price, YoY (CPI-adj.)"
        unit: "% real"
        val: "−2.4"
        pos: 18
        tone: cool
        band: [8, 94]
        ref: {pos: 50, label: "0%"}
        badge: "Falling"
        note: "Prices now losing ground to inflation — the quiet correction."
        source: {transform: real_yoy, series: CSUSHPISA, deflator: CPIAUCSL, fmt: {decimals: 1, sign: true}}
      - id: price_to_rent
        name: "Price-to-rent ratio"
        unit: "idx, 2000=100"
        val: "131"
        pos: 79
        tone: hot
        band: [40, 88]
        ref: {pos: 45, label: "fund."}
        badge: "Stretched"
        note: "Dallas Fed's single best leading indicator; well above fundamentals."
        source: {transform: ratio_index, num: CSUSHPISA, den: CUSR0000SEHA, base_year: 2000, fmt: {decimals: 0}}
      - id: price_to_income
        name: "Price-to-income ratio"
        unit: "× median"
        val: "4.9"
        pos: 82
        tone: hot
        band: [38, 90]
        ref: {pos: 48, label: "norm"}
        badge: "Stretched"
        note: "Near the top of its modern range; long-run mean ≈3.5×, '06 peak 4.7×. Pairs the current median price with annual median income that lags ~18 months, so the ratio runs a touch high between income vintages."
        source: {transform: ratio, num: MSPUS, den: MEHOINUSA646N, fmt: {decimals: 1}}
      - id: median_vs_2019
        name: "Median sale price vs. 2019"
        unit: "% cum."
        val: "+52"
        pos: 84
        tone: hot
        band: [30, 90]
        ref: {pos: 30, label: "'19"}
        badge: "Record high"
        note: "Record NAR median in May; the level effect dominates the soft momentum."
        source: {transform: pct_vs_year, series: HOSMEDUSM052N, base_year: 2019, fmt: {decimals: 0, sign: true}}

  # ── 02 · Affordability ──────────────────────────────────────────────────--
  - id: affordability
    num: "02"
    title: "Affordability"
    tag: "tight, easing at the margin"
    kind: sparks
    items:
      - id: mortgage30
        name: "30-yr fixed mortgage"
        unit: "%"
        val: "6.52"
        tone: warm
        spark: [6.84,6.79,6.72,6.65,6.58,6.61,6.55,6.49,6.44,6.40,6.35,6.43,6.48,6.52]
        ctx: "In a <b>6.4–6.6%</b> band all year. Down from <b>6.84%</b> a year ago; rate-cut hopes faded on the energy shock."
        source: {transform: weekly_spark, series: MORTGAGE30US, n: 14, fmt: {decimals: 2}}
      - id: nar_affordability
        name: "NAR affordability index"
        unit: "idx"
        val: "105.6"
        tone: warm
        spark: [101.4,102,103,104.5,105,107,106,108,109,110,111,105.6]
        ctx: "Higher = more affordable; 100 = a median-income family exactly qualifies for the median home. Improving YoY as <b>income growth</b> edges out price gains."
        source: {transform: weekly_spark, series: FIXHAI, n: 12, fmt: {decimals: 1}}
      - id: implied_pi
        name: "Implied P&I, median home"
        unit: "/mo"
        val: "$2,175"
        tone: hot
        spark: [2240,2225,2205,2180,2160,2170,2155,2135,2120,2110,2095,2130,2155,2175]
        ctx: "20% down on the median, at the prevailing rate. Before taxes & insurance — still near record in dollar terms."
        source: {transform: implied_pi, rate: MORTGAGE30US, price_series: HOSMEDUSM052N, down: 0.20, term_months: 360, n: 14, fmt: {prefix: "$", thousands: true, decimals: 0}}

  # ── 03 · Supply & activity ─────────────────────────────────────────────────
  - id: activity
    num: "03"
    title: "Supply & activity"
    tag: "inventory rebuilding · sales off the lows"
    kind: table
    items:
      - id: existing_sales
        k: "Existing-home sales (SAAR)"
        v: "4.17M"
        p: "4.04M"
        d: "+3.2%"
        dir: "up"
        s: "NAR"
        source: {transform: table_level, series: EXHOSLUSM495S, delta: yoy_pct,
                 fmt: {scale: 1.0e-6, decimals: 2, suffix: "M"}, dfmt: {decimals: 1, sign: true, suffix: "%"}}
      - id: months_supply
        k: "Months' supply"
        v: "4.5"
        p: "4.5"
        d: "−0.1"
        dir: "dn"
        s: "NAR"
        source: {transform: table_level, series: HOSSUPUSM673N, delta: yoy_diff,
                 fmt: {decimals: 1}, dfmt: {decimals: 1, sign: true}}
      - id: total_inventory
        k: "Active listings"
        v: "1.06M"
        p: "1.04M"
        d: "+2.2%"
        dir: "up"
        s: "Realtor.com"
        source: {transform: table_level, series: ACTLISCOUUS, delta: yoy_pct,
                 fmt: {scale: 1.0e-6, decimals: 2, suffix: "M"}, dfmt: {decimals: 1, sign: true, suffix: "%"}}
      - id: median_existing_price
        k: "Median existing-home price"
        v: "$429,300"
        p: "$417,700"
        d: "record"
        dir: "up"
        s: "NAR"
        source: {transform: table_level, series: HOSMEDUSM052N, delta: yoy_pct,
                 fmt: {prefix: "$", thousands: true, decimals: 0}, dfmt: {decimals: 1, sign: true, suffix: "%"}}
      - id: median_dom
        k: "Median days on market"
        v: "49"
        p: "46"
        d: "+3 days"
        dir: "up"
        s: "Realtor.com"
        source: {transform: table_level, series: MEDDAYONMARUS, delta: yoy_diff,
                 fmt: {decimals: 0}, dfmt: {decimals: 0, sign: true, suffix: " days"}}
      - id: price_drops
        k: "Listings with a price cut"
        v: "33.4%"
        p: "32.6%"
        d: "−2.6 pt"
        dir: "dn"
        s: "Realtor.com"
        source: {transform: table_ratio, num: PRIREDCOUUS, den: ACTLISCOUUS, delta: yoy_diff,
                 fmt: {scale: 100, decimals: 1, suffix: "%"}, dfmt: {decimals: 1, sign: true, suffix: " pt"}}
      - id: new_home_sales
        k: "New-home sales (SAAR)"
        v: "622K"
        p: "640K"
        d: "−5.8%"
        dir: "dn"
        s: "Census"
        source: {transform: table_level, series: HSN1F, delta: yoy_pct,
                 fmt: {decimals: 0, suffix: "K"}, dfmt: {decimals: 1, sign: true, suffix: "%"}}
      - id: housing_starts
        k: "Housing starts (SAAR)"
        v: "1.31M"
        p: "1.34M"
        d: "−4.6%"
        dir: "dn"
        s: "Census"
        source: {transform: table_level, series: HOUST, delta: yoy_pct,
                 fmt: {scale: 1.0e-3, decimals: 2, suffix: "M"}, dfmt: {decimals: 1, sign: true, suffix: "%"}}

  # ── 04 · Financing & stress ─────────────────────────────────────────────────
  - id: stress
    num: "04"
    title: "Financing & stress"
    tag: "rising off lows · structurally resilient"
    kind: gauges
    items:
      - id: seriously_delinquent
        name: "Single-family delinquency rate"
        unit: "% past due"
        val: "1.89"
        pos: 36
        tone: warm
        band: [10, 96]
        ref: {pos: 24, label: "low"}
        badge: "Rising, low"
        note: "All-bank single-family mortgage delinquency (Fed, SA). Off the floor but far below the ~11% crisis peak."
        source: {transform: level, series: DRSFRMACBS, fmt: {decimals: 2}}
      - id: equity_cushion
        name: "Household equity cushion"
        unit: "% owners' equity"
        val: "71.6"
        pos: 20
        tone: cool
        band: [10, 90]
        ref: {pos: 60, label: "'06"}
        badge: "Strong"
        note: "Z.1 owners' equity share near record; the structural firebreak vs. 2006."
        source: {transform: level, series: HOEREPHRE, fmt: {decimals: 1}}
      - id: lending_standards
        name: "Bank lending standards"
        unit: "net % tightening"
        val: "−3.7"
        pos: 54
        tone: warm
        band: [15, 95]
        ref: {pos: 50, label: "neutral"}
        badge: "Easing a touch"
        note: "SLOOS net % of banks tightening on GSE-eligible mortgages. Negative = a small net share easing — supportive, not restrictive."
        source: {transform: level, series: SUBLPDHMSENQ, fmt: {decimals: 1, sign: true}}

footer:
  note: >-
    Each gauge places the current reading on a cool→hot scale relative to its own
    history; the marker's colour is the editorial temperature, not the raw value.
    Calibration of <code>pos</code> and <code>band</code> is editorial judgment, not a
    published index — the live values underneath are real and sourced.
