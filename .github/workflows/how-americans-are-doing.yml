name: How Americans Are Doing refresh

# Monthly refresh of lab/how-americans-are-doing/data.json. Re-fetches the LIVE
# FRED series (income, consumption, GDP per person, inequality, US-vs-Europe) and
# re-merges the committed lab/how-americans-are-doing/curated.json. The fetcher is
# pure Python stdlib, so no dependencies are installed. data.json carries no
# wall-clock timestamp (only real data dates), so a month with no new data produces
# no diff and no commit.
# Relocated from econvitals/site (2026-08-10, chart-system rebuild Stage B): the data
# publishes from this repo via raw URLs — no Netlify deploy is involved.
# Secrets required: FRED_API_KEY.

on:
  schedule:
    - cron: "0 12 1 * *"   # 12:00 UTC on the 1st of each month (time of day irrelevant)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: how-americans-are-doing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Rebuild data.json (live FRED + curated)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python builders/how-americans-are-doing/fetch_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "haad-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/how-americans-are-doing/data.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "how-americans-are-doing: refresh data"
          # push can race with the other refresh jobs / fleet-host auto-pushes;
          # rebase on the latest main and retry rather than failing the run
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $i) — rebasing on latest main and retrying"
            git pull --rebase --autostash origin main
          done
          echo "how-americans-are-doing: push still failing after 5 attempts" >&2
          exit 1
