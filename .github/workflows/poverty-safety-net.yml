name: Poverty & Safety Net refresh

# Rebuilds lab/poverty-safety-net/data.json from U.S. Census public APIs (SAIPE +
# ACS), committing only on change. Annual data, so monthly is plenty. geo.json is
# only written if missing (it is committed, so normal runs never touch it).
# Relocated from econvitals/site (2026-08-10, chart-system rebuild Stage B): the data
# publishes from this repo via raw URLs — no Netlify deploy is involved.
# Secrets required: CENSUS_API_KEY.

on:
  schedule:
    - cron: "30 8 3 * *"   # monthly, 3rd of the month; annual data, timing irrelevant
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poverty-safety-net
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build poverty & safety-net data (Census, stdlib only)
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python builders/poverty-safety-net/build.py
      - name: Commit refreshed data
        run: |
          git config user.name "poverty-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lab/poverty-safety-net/data.json lab/poverty-safety-net/geo.json
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "poverty-safety-net: refresh Census data"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $i) — rebasing on latest main and retrying"
            git pull --rebase --autostash origin main
          done
          echo "poverty-safety-net: push still failing after 5 attempts" >&2
          exit 1
